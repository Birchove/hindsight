[project]
name = "hindsight-local"
version = "0.0.0"
description = "Local workspace: hindsight-api-slim only"
requires-python = ">=3.11"
dependencies = [
    # embedded-db = pg0; local-ml = local embed/rerank; test = pytest suite deps
    "hindsight-api-slim[embedded-db,local-ml,test]",
]

[tool.uv.workspace]
members = ["hindsight-api-slim"]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"

[tool.uv.sources]
hindsight-api-slim = { workspace = true }
