line-length = 120
target-version = "py311"
exclude = [
    "**/.venv/",
    "**/dist/",
    "**/build/",
]

[lint]
exclude = [
    "tests/**",
    "**/tests/**",
]
select = ["E", "W", "F", "I"]
ignore = ["E501", "E402", "F401", "F841", "F811", "F821"]

[format]
quote-style = "double"
indent-style = "space"
